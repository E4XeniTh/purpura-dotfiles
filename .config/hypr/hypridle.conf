# hypridle isn't needed any more: locking, sleeping and the warning before
# locking are the shell's own (Settings > Shell > Power, components/Idle.qml), and
# the shell answers apps' D-Bus "don't go idle" requests itself
# (helpers/idle_inhibit). An older hyprland.lua may still start hypridle,
# so this keeps it out of the way: no listeners, and it leaves the
# org.freedesktop.ScreenSaver name free for the shell's helper.

general {
    ignore_dbus_inhibit = true
    ignore_systemd_inhibit = true
}
