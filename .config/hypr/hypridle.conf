
listener {
    timeout = 180                                                                                     # 2.5min.
    on-timeout = brightnessctl -s 15
    on-resume = brightnessctl -r
}

listener {
    timeout = 600 # 10min
    on-timeout = hyprctl dispatch 'hl.dsp.global("quickshell:lockscreen")'
}

listener {
    timeout = 3600 # 1hours
    on-timeout = systemctl suspend
}
