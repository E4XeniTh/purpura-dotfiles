# Only the AFK reminders live here. Locking the screen and putting the
# computer to sleep are the shell's - Settings > Shell > Power (Idle.qml),
# which also sends the "Locking screen in 1 minute" warning, so it follows
# the auto-lock delay set there.

listener {
    timeout = 180
    on-timeout = notify-send "AFK" "3 minutes of inactivity has passed." -i system-suspend-uninhibited
}

listener {
    timeout = 300
    on-timeout = notify-send "AFK" "5 minutes of inactivity has passed." -i system-suspend-uninhibited
}
