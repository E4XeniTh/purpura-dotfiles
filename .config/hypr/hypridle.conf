
listener {
    timeout = 180                                                                                     # 2.5min.
    on-timeout = ddcutil setvcp 10 0                                                                # set monitor backlight to minimum, avoid 0 on OLED monitor.
    on-resume = ddcutil setvcp 10 100                                                               # monitor backlight restore.
}

listener {
    timeout = 300                                                                                   # 5min
    on-timeout = hyprctl dispatch 'hl.dsp.global("quickshell:lockscreen")'                          # lock screen when timeout has passed
}

listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
